name: Atualizar dados
on:
  schedule: [{ cron: '0 6 * * *' }]      # todo dia, 03:00 em Brasília
  workflow_dispatch: {}
permissions: { contents: write, pages: write, issues: write }
concurrency: atualizar
jobs:
  atualizar:
    runs-on: macos-latest                # fotos precisam de sips e swift (só existem no macOS); repositório público: minutos grátis
    timeout-minutes: 60
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Coletar (gta.wiki e guias públicos)
        working-directory: pipeline
        run: |
          mkdir -p work data-dist state
          cp ../*.json data-dist/                                   # pacote publicado: base do portão "não encolher"
          python3 tools/gtawiki_sync.py app/www work                # itens
          python3 tools/heists_build.py app/www work                # assaltos: tipos, locais e receptadores (gta.wiki)
          python3 tools/layers_build.py app/www state work || echo "camadas: falhou, o pacote segue sem mudar as camadas"   # camadas que o dono aprovou (tools/layers_approved.json): gta.wiki → GTADB → Open GTA 6 Map
          python3 tools/eggs_build.py app/www work                  # easter eggs: dados guardados (sem desenhar no mapa); avisa o que a gta.wiki tem a mais
          python3 tools/missions_build.py app/www work              # missões (só gta.wiki)
          python3 tools/missions_crosscheck.py work                 # 2ª fonte: guias que concordam entre si
          python3 tools/factdb.py work work/gtavi.db                # status por fato
          python3 tools/missions_build.py app/www work              # missões finais
      - name: Revisão diária de todas as seções (gta.wiki)
        working-directory: pipeline
        run: |
          python3 tools/sections_watch.py app/www work state        # seções novas, lacunas, páginas novas e páginas vigiadas
          cp work/revisao-diaria.md ../revisao-diaria.md
      - name: Mapa e fotos de lugares (GTADB, CC BY 4.0)
        working-directory: pipeline
        run: |
          mkdir -p app/www/ph app/www/ig
          cp -R ../ph/. app/www/ph/ 2>/dev/null || true
          cp -R ../ig/. app/www/ig/ 2>/dev/null || true
          python3 tools/gtadb_sync.py app/www work
      - name: Fotos do jogo (gta.wiki)
        working-directory: pipeline
        run: |
          mkdir -p bin work/gw/dl
          swiftc -O tools/sharp.swift -o bin/sharp
          swiftc -O tools/dhash.swift -o bin/dhash
          cp state/*.json work/gw/ 2>/dev/null || true
          python3 tools/gtawiki_images.py app/www work/gw
          for i in $(seq 1 20); do
            out=$(python3 tools/gtawiki_fetch.py app/www work/gw bin/sharp bin/dhash 25 2>&1 | tail -3)
            echo "$out"
            echo "$out" | grep -q "^0 pictures left" && break
          done
          cp work/gw/fetch_state.json work/gw/known_hashes.json state/ 2>/dev/null || true
          cp work/gw/images.json state/ 2>/dev/null || true
      - name: Radar, gta.wiki nova, pontos do mapa e vídeos (para a página Aprovações; nada entra no app daqui)
        working-directory: pipeline
        continue-on-error: true                                     # site fora do ar não pode travar a publicação dos dados
        run: |
          mkdir -p ../radar
          python3 tools/wiki_new.py app/www state ../radar/wiki_new.json           # toda página nova de GTA VI na gta.wiki
          python3 tools/wiki_points.py app/www state ../radar/map_candidates.json  # pontos {{LeonidaDayMap}} da gta.wiki (guardados, não desenhados)
          python3 tools/radar.py app/www state ../radar/radar.json                 # notícias (~50 sites) e canais do YouTube
          python3 tools/videos_match.py app/www state ../radar/item_videos.json 40 # um vídeo de guia por item (missões, veículos, armas...)
          python3 tools/photo_suggest.py app/www state ../radar/photo_suggest.json 40 # fotos de dentro do jogo para itens sem foto ou com uma só
          python3 tools/ogm_sync.py ../radar/ogm_points.json                     # Open GTA 6 Map (CC BY 4.0): 3ª fonte de posição, depois de gta.wiki e GTADB
      - name: Portão de release e empacotamento (com o que o dono tirou do app)
        working-directory: pipeline
        run: |
          # "Fora do app" vale só para o pacote: a cópia em work/pub perde o item, a origem fica inteira (assim "Voltar ao app" funciona)
          rm -rf work/pub && mkdir -p work/pub/app/www work/pub/data-dist
          cp app/www/*.js work/pub/app/www/ && cp data-dist/*.json work/pub/data-dist/ 2>/dev/null || true
          python3 tools/data_admin.py apply work/pub/app/www ../admin/hidden.json
          python3 tools/photo_main.py work/pub/app/www ../admin/photomain.json  # foto principal escolhida pelo dono na aba Dados do app
          python3 tools/publish_data.py --root work/pub --base-url "https://${{ github.repository_owner }}.github.io/vi-guide-data/"
          cp work/pub/data-dist/*.json data-dist/ && cp work/pub/app/www/dataver.js app/www/dataver.js
      - name: Publicar se mudou
        run: |
          cp pipeline/data-dist/*.json .
          cp -R pipeline/app/www/ph/. ph/ 2>/dev/null || true
          cp -R pipeline/app/www/ig/. ig/ 2>/dev/null || true
          date -u +%FT%TZ > ultima-execucao.txt                     # um commit por dia mantém o agendamento ativo (o GitHub o desliga após 60 dias sem atividade)
          git config user.name "VI Guide bot"; git config user.email "actions@users.noreply.github.com"
          git add -A -- '*.json' ultima-execucao.txt revisao-diaria.md pipeline/app/www pipeline/state pipeline/tools/gtadb_rev.txt ph ig radar
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "Dados de $(date -u +%F)"
          git push
          gh api -X POST repos/${{ github.repository }}/pages/builds >/dev/null   # pushes do bot não disparam o build do Pages sozinhos
          n=$(python3 -c "import json;print(len(json.load(open('pipeline/work/sections_report.json'))['alerts']))")
          if [ "$n" != "0" ]; then                                   # novidade nas fontes: avisar o dono por uma issue (uma só, com comentários)
            gh label create revisao-diaria --force >/dev/null 2>&1 || true
            ex=$(gh issue list --state open --label revisao-diaria --json number --jq '.[0].number')
            if [ -z "$ex" ]; then gh issue create --title "Revisão diária: novidades nas fontes" --label revisao-diaria --body-file revisao-diaria.md; else gh issue comment "$ex" --body-file revisao-diaria.md; fi
          fi
